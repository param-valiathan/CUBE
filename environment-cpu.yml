# CUBE conda environment for computers WITHOUT an NVIDIA GPU (pose tracking in Step 1 will be slow;
# Steps 2-5 are unaffected). Easiest route: double-click install_cube.bat, which picks this automatically.
#
# Manual install (run from this folder):
#   conda env create -f environment-cpu.yml
#   conda activate CUBE
#   python -m pip install --no-deps -r requirements-lock-cpu.txt
name: CUBE
channels:
  - conda-forge
dependencies:
  - python=3.12.13
  - pip
